name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 tools/validate_skill.py
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 tools/check_workflow.py
      - run: node --test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-${{ matrix.os }}
          path: .workbuddy/verification/latest-workflow.json
          include-hidden-files: true

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: .workbuddy/qa/*.png
          include-hidden-files: true
